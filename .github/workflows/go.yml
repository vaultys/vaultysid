name: Go CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["develop", "main"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: go vet ./...
      - run: go test ./...

  # Saltpack must stay byte-compatible in both directions. The committed vectors
  # only prove compatibility with the code that generated them; regenerating them
  # here on every change is what catches one side drifting from the other.
  saltpack-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: cd typescript && pnpm install
      - name: TypeScript encrypts, Go decrypts
        run: |
          cd typescript && pnpm tsx test/interops/generate-saltpack-vectors.ts
          cd ../go && go test ./test/compatibility -run TestSaltpackTypeScriptVectors -v
      - name: Go encrypts, TypeScript decrypts
        run: |
          cd go/test/compatibility && go run generate_saltpack_vectors.go
          cd ../../../typescript && pnpm mocha test/interops/go-saltpack-compatibility.test.ts
