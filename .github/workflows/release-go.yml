name: Release Go CLI

on:
  push:
    tags:
      - 'v*'
      - 'go-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  build:
    name: Build Cross-Platform Binaries
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          # Linux
          - goos: linux
            goarch: amd64
            suffix: ''
          - goos: linux
            goarch: '386'
            suffix: ''
          - goos: linux
            goarch: arm64
            suffix: ''
          - goos: linux
            goarch: arm
            goarm: '7'
            suffix: ''
          - goos: linux
            goarch: arm
            goarm: '6'
            suffix: ''
          - goos: linux
            goarch: riscv64
            suffix: ''
          - goos: linux
            goarch: ppc64le
            suffix: ''
          - goos: linux
            goarch: s390x
            suffix: ''

          # macOS
          - goos: darwin
            goarch: amd64
            suffix: ''
          - goos: darwin
            goarch: arm64
            suffix: ''

          # Windows
          - goos: windows
            goarch: amd64
            suffix: '.exe'
          - goos: windows
            goarch: '386'
            suffix: '.exe'
          - goos: windows
            goarch: arm64
            suffix: '.exe'
          - goos: windows
            goarch: arm
            suffix: '.exe'

          # FreeBSD
          - goos: freebsd
            goarch: amd64
            suffix: ''
          - goos: freebsd
            goarch: '386'
            suffix: ''
          - goos: freebsd
            goarch: arm64
            suffix: ''
          - goos: freebsd
            goarch: arm
            suffix: ''

          # OpenBSD
          - goos: openbsd
            goarch: amd64
            suffix: ''
          - goos: openbsd
            goarch: '386'
            suffix: ''
          - goos: openbsd
            goarch: arm64
            suffix: ''
          - goos: openbsd
            goarch: arm
            suffix: ''

          # NetBSD
          - goos: netbsd
            goarch: amd64
            suffix: ''
          - goos: netbsd
            goarch: '386'
            suffix: ''
          - goos: netbsd
            goarch: arm64
            suffix: ''
          - goos: netbsd
            goarch: arm
            suffix: ''

          # Android
          - goos: android
            goarch: arm64
            suffix: ''

          # Solaris
          - goos: solaris
            goarch: amd64
            suffix: ''

          # Plan9
          - goos: plan9
            goarch: amd64
            suffix: ''
          - goos: plan9
            goarch: '386'
            suffix: ''
          - goos: plan9
            goarch: arm
            suffix: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: go/go.sum

      - name: Get version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
            # Remove 'go-' prefix if present
            VERSION=${VERSION#go-}
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          cd go
          VERSION="${{ steps.version.outputs.VERSION }}"
          COMMIT="${GITHUB_SHA::8}"
          BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
          LDFLAGS="-s -w -X main.Version=${VERSION} -X main.Commit=${COMMIT} -X main.BuildTime=${BUILD_TIME}"

          # Build binary name
          BINARY_NAME="vaultysid-cli-${VERSION}-${GOOS}-${GOARCH}"
          if [[ -n "${GOARM}" ]]; then
            BINARY_NAME="${BINARY_NAME}v${GOARM}"
          fi
          BINARY_NAME="${BINARY_NAME}${{ matrix.suffix }}"

          # Build
          go build -ldflags "${LDFLAGS}" -o "../${BINARY_NAME}" ./cmd/vaultysid-cli

          # Create archive
          cd ..
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            # Create zip for Windows
            zip "${BINARY_NAME}.zip" "${BINARY_NAME}" LICENSE README.md
            echo "ARCHIVE=${BINARY_NAME}.zip" >> $GITHUB_ENV
          else
            # Create tar.gz for Unix-like systems
            tar -czf "${BINARY_NAME}.tar.gz" "${BINARY_NAME}" LICENSE README.md
            echo "ARCHIVE=${BINARY_NAME}.tar.gz" >> $GITHUB_ENV
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: binaries
          path: ${{ env.ARCHIVE }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          name: binaries
          path: ./artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > checksums-sha256.txt
          sha512sum * > checksums-sha512.txt

      - name: Get version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
            VERSION=${VERSION#go-}
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: release_notes
        run: |
          cat << EOF > RELEASE_NOTES.md
          # VaultysID CLI ${VERSION}

          ## 📦 Installation

          ### macOS
          \`\`\`bash
          # Intel Mac
          curl -L https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/vaultysid-cli-${{ steps.version.outputs.VERSION }}-darwin-amd64.tar.gz | tar xz
          sudo mv vaultysid-cli-${{ steps.version.outputs.VERSION }}-darwin-amd64 /usr/local/bin/vaultysid-cli

          # Apple Silicon (M1/M2)
          curl -L https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/vaultysid-cli-${{ steps.version.outputs.VERSION }}-darwin-arm64.tar.gz | tar xz
          sudo mv vaultysid-cli-${{ steps.version.outputs.VERSION }}-darwin-arm64 /usr/local/bin/vaultysid-cli
          \`\`\`

          ### Linux
          \`\`\`bash
          # AMD64
          curl -L https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/vaultysid-cli-${{ steps.version.outputs.VERSION }}-linux-amd64.tar.gz | tar xz
          sudo mv vaultysid-cli-${{ steps.version.outputs.VERSION }}-linux-amd64 /usr/local/bin/vaultysid-cli

          # ARM64
          curl -L https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/vaultysid-cli-${{ steps.version.outputs.VERSION }}-linux-arm64.tar.gz | tar xz
          sudo mv vaultysid-cli-${{ steps.version.outputs.VERSION }}-linux-arm64 /usr/local/bin/vaultysid-cli
          \`\`\`

          ### Windows
          Download the appropriate zip file and extract to your PATH:
          - [Windows AMD64](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/vaultysid-cli-${{ steps.version.outputs.VERSION }}-windows-amd64.exe.zip)
          - [Windows 386](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/vaultysid-cli-${{ steps.version.outputs.VERSION }}-windows-386.exe.zip)
          - [Windows ARM64](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/vaultysid-cli-${{ steps.version.outputs.VERSION }}-windows-arm64.exe.zip)

          ## 🔒 Verify Downloads

          Download the checksum files and verify:
          \`\`\`bash
          # SHA256
          curl -L https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/checksums-sha256.txt
          sha256sum -c checksums-sha256.txt

          # SHA512
          curl -L https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/checksums-sha512.txt
          sha512sum -c checksums-sha512.txt
          \`\`\`

          ## 🚀 Quick Start

          \`\`\`bash
          # Generate a new identity
          vaultysid-cli generate person -o json

          # Get help
          vaultysid-cli --help
          \`\`\`

          ## 📋 Supported Platforms

          | OS | Architecture | Status |
          |---|---|---|
          | Linux | amd64, 386, arm64, arm/v7, arm/v6, riscv64, ppc64le, s390x | ✅ |
          | macOS | amd64 (Intel), arm64 (Apple Silicon) | ✅ |
          | Windows | amd64, 386, arm64, arm | ✅ |
          | FreeBSD | amd64, 386, arm64, arm | ✅ |
          | OpenBSD | amd64, 386, arm64, arm | ✅ |
          | NetBSD | amd64, 386, arm64, arm | ✅ |
          | Android | arm64 | ✅ |
          | Solaris | amd64 | ✅ |
          | Plan9 | amd64, 386, arm | ✅ |

          ## 📝 Changelog

          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/go/CHANGELOG.md) for details.

          ---
          Built with Go $(go version | cut -d' ' -f3)
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: VaultysID CLI ${{ steps.version.outputs.VERSION }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'alpha') || contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'rc') }}
          files: |
            artifacts/*

  docker:
    name: Build Docker Images
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Linux AMD64 binary
        uses: actions/download-artifact@v3
        with:
          name: binaries
          path: ./artifacts

      - name: Extract binary
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION=${VERSION#go-}
          tar -xzf artifacts/vaultysid-cli-${VERSION}-linux-amd64.tar.gz
          mv vaultysid-cli-${VERSION}-linux-amd64 vaultysid-cli

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: go/Dockerfile.cli
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            vaultys/vaultysid-cli:latest
            vaultys/vaultysid-cli:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/vaultysid-cli:latest
            ghcr.io/${{ github.repository_owner }}/vaultysid-cli:${{ github.ref_name }}
